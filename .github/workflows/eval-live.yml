# The quality gate, and what makes this more than a demo: runs the golden set
# against the deployed service and fails on a regression past the tolerance in
# eval/run_eval.py. Nightly rather than per-PR because it costs tokens; PRs get
# the free replay run in ci.yml.

name: eval-live

on:
  schedule:
    - cron: "0 18 * * *" # 05:00 Sydney
  workflow_dispatch:
    inputs:
      no_reranker:
        description: "Run the no-reranker comparison arm"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the app URL
        id: app
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Pick the newest committed baseline
        id: baseline
        run: |
          latest=$(ls -1 eval/baselines/*.json 2>/dev/null | sort | tail -1 || true)
          echo "path=$latest" >> "$GITHUB_OUTPUT"
          echo "baseline: ${latest:-none committed yet}"

      - name: Run the golden set
        run: |
          args="--live --api-url ${{ steps.app.outputs.url }} --out eval/reports/summary.json"
          if [ "${{ inputs.no_reranker }}" = "true" ]; then
            args="$args --no-reranker"
          fi
          if [ -n "${{ steps.baseline.outputs.path }}" ]; then
            args="$args --gate ${{ steps.baseline.outputs.path }}"
          fi
          python eval/run_eval.py $args

      # Uploaded either way - a failed run is the one you want to read.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_number }}
          path: |
            eval/reports/
            eval/fixtures/
          retention-days: 30
