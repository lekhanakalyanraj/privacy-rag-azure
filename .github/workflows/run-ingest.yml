# Run ingestion. Manual only: it spends tokens and rewrites the live index, so
# it is a decision, not a side effect of a merge. Running it here rather than
# from a laptop uses the job's own identity and leaves a log.
#
# Re-run eval-live afterwards - the index changed, so the baseline may not hold.

name: run-ingest

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Rebuild the index from scratch (required after a schema change)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: run-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start the job
        id: start
        run: |
          args='[]'
          if [ "${{ inputs.recreate }}" = "true" ]; then
            args='["--recreate"]'
          fi
          execution=$(az containerapp job start \
            --name "${{ vars.INGEST_JOB_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --args "$args" \
            --query name -o tsv)
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "started: $execution"

      # Wait for a terminal status: a job that silently fails is worse than one
      # that never ran.
      - name: Wait for completion
        run: |
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --name "${{ vars.INGEST_JOB_NAME }}" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --job-execution-name "${{ steps.start.outputs.execution }}" \
              --query properties.status -o tsv)
            echo "[$i] $status"
            case "$status" in
              Succeeded) echo "ingestion complete"; exit 0 ;;
              Failed|Degraded) echo "ingestion failed"; exit 1 ;;
            esac
            sleep 20
          done
          echo "timed out waiting for the job"; exit 1
