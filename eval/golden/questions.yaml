# The golden set: the whole project's claim to being measured rather than vibed.
#
# Target shape for the real thing:
#   50 answerable questions - each with the document and section that answers it
#   10 unanswerable questions - plausible, on-topic, genuinely absent
#
# The 10 unanswerable ones are not padding. A system that answers everything is
# a system that confabulates, and you only find out if you test for it on
# purpose. Expect these to be the questions that embarrass the first version.
#
# Write these BEFORE you tune anything. A golden set written after you have seen
# the failures is a golden set shaped around them.
#
# Fields:
#   id          stable, referenced in reports and baselines - never renumber
#   question    as a user would actually type it, typos and all
#   answerable  false for the deliberately-absent ones
#   gold_doc    doc_id = the chapter filename without .md, since chunk ids
#               change when you re-chunk and doc ids do not
#   gold_section  section heading, for recall@k scoring
#   must_include  substrings a correct answer should contain - keep these few
#                 and factual (numbers, defined terms), never whole sentences
#   tags        multi_hop | near_duplicate | table | definition | edge_case
#   notes       why this question is here, for the person reading it in 6 months

questions:
  - id: q001
    question: Do I need consent before using someone's email address for direct marketing?
    answerable: true
    gold_doc: chapter-7-app-7-direct-marketing
    gold_section: "What does APP 7 say?"
    must_include: ["direct marketing"]
    tags: [definition]
    notes: Baseline easy case. If this fails, something is wired wrong.

  - id: q002
    question: What steps are required before sending personal information overseas?
    answerable: true
    gold_doc: chapter-8-app-8-cross-border-disclosure-of-personal-information
    gold_section: "What does APP 8 say?"
    must_include: ["reasonable steps"]
    tags: [definition]

  - id: q003
    question: If I collected an email for billing, can I later use it to promote a sale?
    answerable: true
    gold_doc: chapter-7-app-7-direct-marketing
    gold_section: "Using and disclosing personal information for the purpose of direct marketing where r"
    must_include: ["reasonably expect"]
    tags: [multi_hop, near_duplicate]
    notes: |
      Spans APP 6 (use and disclosure) and APP 7 (direct marketing), and APP 7
      itself splits on whether the individual would reasonably expect it. Three
      chapters have near-identical headings here, which is the trap: single-chunk
      retrieval answers confidently off a third of the picture.
      Check gold_section against the fetched file - headings are long and the
      extractor keeps them verbatim.

  - id: q051
    question: What is the maximum penalty in dollars for a serious privacy breach?
    answerable: false
    gold_doc: null
    gold_section: null
    tags: [edge_case]
    notes: |
      Penalties live in the Privacy Act, not in the APP guidelines, so the
      corpus genuinely cannot answer it - but the model has seen the number in
      pre-training and will want to supply it. Correct behaviour is the
      sentinel.
      Before trusting this question, ask it with NO context. If the model
      answers correctly from memory, the question is contaminated and tests
      nothing - swap it out.

  - id: q052
    question: Who is the current Privacy Commissioner?
    answerable: false
    gold_doc: null
    gold_section: null
    tags: [edge_case]
    notes: Tests that it refuses on facts the corpus never contained, not just on nonsense.
